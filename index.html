<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Haty Ahmed Nada - Ain Shams</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family:'Cairo',sans-serif;
  background:#0f0f0f;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
}
.strip-top, .strip-bottom { width:100%; height:6px; background:#c8101e; }
.strip-bottom { margin-top:auto; }
.hero {
  width:100%;
  max-width:480px;
  padding:28px 24px 0;
  margin-bottom:20px;
  text-align:center;
}
.logo-img {
  width:260px;
  height:auto;
  display:block;
  margin:0 auto;
  filter:drop-shadow(0 4px 28px rgba(255,200,0,0.4));
}
.branch-tag {
  display:inline-block;
  background:#c8101e;
  color:#fff;
  font-size:13px;
  font-weight:700;
  padding:5px 22px;
  border-radius:30px;
  margin-top:8px;
  margin-bottom:4px;
}
.divider {
  width:50px;
  height:3px;
  background:#f5c842;
  margin:0 auto 6px;
  border-radius:2px;
}
.links {
  width:100%;
  max-width:400px;
  padding:0 20px;
  padding-top:20px;
  display:flex;
  flex-direction:column;
  gap:11px;
  margin-bottom:40px;
}
.btn {
  display:flex;
  align-items:center;
  gap:14px;
  padding:14px 18px;
  border-radius:14px;
  text-decoration:none;
  color:#fff;
  font-family:'Cairo',sans-serif;
  font-size:15px;
  font-weight:700;
  background:#1c1c1c;
  border:1px solid rgba(255,255,255,0.07);
  position:relative;
  overflow:hidden;
  transition:transform 0.15s, background 0.15s;
}
.btn::after {
  content:'';
  position:absolute;
  right:0; top:0; bottom:0;
  width:4px;
  background:#f5c842;
  border-radius:0 14px 14px 0;
}
.btn:hover { transform:translateY(-2px); background:#242424; }
.btn:active { transform:scale(0.98); }
.btn-icon {
  width:42px;
  height:42px;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
}
.btn-icon svg { width:24px; height:24px; }
.icon-menu { background:#2a1a00; }
.icon-map  { background:#1a3a2a; }
.icon-star { background:#1a1a2e; }
.icon-ig   { background:#2e1a2a; }
.icon-tt   { background:#1a1f2e; }
.icon-fb   { background:#1a2035; }
.btn-label { flex:1; text-align:left; direction:ltr; }
.btn-arrow { color:rgba(245,200,66,0.55); font-size:20px; flex-shrink:0; }
.footer {
  padding-bottom:26px;
  color:rgba(255,255,255,0.15);
  font-size:11px;
  text-align:center;
}
</style>
</head>
