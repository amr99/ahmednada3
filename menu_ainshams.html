<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Menu - Haty Ahmed Nada - Ain Shams</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: #0f0f0f;
  font-family: 'Cairo', sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  overflow-x: hidden;
}
.strip { width:100%; height:6px; background:#c8101e; }
.header {
  width:100%;
  max-width:480px;
  padding: 20px 16px 12px;
  text-align:center;
}
.header-title {
  color:#f5c842;
  font-size:20px;
  font-weight:900;
  letter-spacing:2px;
}
.header-sub {
  color:rgba(255,255,255,0.4);
  font-size:12px;
  margin-top:2px;
}
.page-counter {
  color:#f5c842;
  font-size:13px;
  font-weight:700;
  margin-top:6px;
}
.viewer {
  width:100%;
  max-width:480px;
  position:relative;
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  padding: 0 8px;
}
.menu-img {
  width:100%;
  max-width:460px;
  height:auto;
  border-radius:12px;
  display:block;
  box-shadow: 0 8px 32px rgba(0,0,0,0.6);
  transition: opacity 0.2s;
}
.nav-btn {
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  width:44px;
  height:44px;
  border-radius:50%;
  border:none;
  background:rgba(200,16,30,0.85);
  color:white;
  font-size:22px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:10;
  box-shadow:0 2px 12px rgba(0,0,0,0.5);
  transition: background 0.15s;
}
.nav-btn:hover { background:#c8101e; }
.nav-prev { left:0px; }
.nav-next { right:0px; }
.thumbs {
  width:100%;
  max-width:480px;
  padding: 12px 8px;
  display:flex;
  gap:6px;
  overflow-x:auto;
  scrollbar-width:none;
}
.thumbs::-webkit-scrollbar { display:none; }
.thumb {
  width:48px;
  height:60px;
  flex-shrink:0;
  border-radius:6px;
  overflow:hidden;
  cursor:pointer;
  border:2px solid transparent;
  transition: border-color 0.15s, transform 0.15s;
  opacity:0.6;
}
.thumb img {
  width:100%;
  height:100%;
  object-fit:cover;
}
.thumb.active {
  border-color:#f5c842;
  opacity:1;
  transform:scale(1.08);
}
.back-btn {
  display:flex;
  align-items:center;
  gap:8px;
  margin: 8px 0 16px;
  padding:10px 24px;
  background:#1c1c1c;
  border:1px solid rgba(255,255,255,0.1);
  border-radius:30px;
  color:#f5c842;
  font-family:'Cairo',sans-serif;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
  text-decoration:none;
}
.back-btn:hover { background:#242424; }
</style>
</head>
<body>
<div class="strip"></div>

<div class="header">
  <div class="header-title">Our Menu</div>
  <div class="header-sub">Haty Ahmed Nada — El Naam</div>
  <div class="page-counter" id="counter">1 / 8</div>
</div>

<div class="viewer">
  <button class="nav-btn nav-prev" onclick="navigate(-1)">&#8249;</button>
  <img class="menu-img" id="mainImg" src="" alt="Menu">
  <button class="nav-btn nav-next" onclick="navigate(1)">&#8250;</button>
</div>

<div class="thumbs" id="thumbs"></div>

<a class="back-btn" href="javascript:history.back()">&#8592; Back</a>

<div class="strip"></div>

<script>
const images = [
"images_ainshams/1.png",
"images_ainshams/2.png",
"images_ainshams/3.png",
"images_ainshams/4.png",
"images_ainshams/5.png",
"images_ainshams/6.png",
"images_ainshams/7.png",
"images_ainshams/8.png"
];

let current = 0;

function showPage(n) {
  current = (n + images.length) % images.length;
  const img = document.getElementById('mainImg');
  img.style.opacity = '0';
  setTimeout(() => {
    img.src = images[current];
    img.style.opacity = '1';
  }, 100);
  document.getElementById('counter').textContent = (current+1) + ' / ' + images.length;
  document.querySelectorAll('.thumb').forEach((t,i) => {
    t.classList.toggle('active', i === current);
  });
  document.querySelectorAll('.thumb')[current].scrollIntoView({behavior:'smooth', block:'nearest', inline:'center'});
}

function navigate(dir) {
  showPage(current + dir);
}

let touchStartX = 0;
document.addEventListener('touchstart', e => touchStartX = e.touches[0].clientX);
document.addEventListener('touchend', e => {
  const diff = touchStartX - e.changedTouches[0].clientX;
  if (Math.abs(diff) > 50) navigate(diff > 0 ? 1 : -1);
});

const thumbsEl = document.getElementById('thumbs');
images.forEach((src, i) => {
  const div = document.createElement('div');
  div.className = 'thumb' + (i===0?' active':'');
  div.onclick = () => showPage(i);
  const img = document.createElement('img');
  img.src = src;
  div.appendChild(img);
  thumbsEl.appendChild(div);
});

showPage(0);
</script>
</body>
</html>
